version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all minor and patch updates; majors get their own PRs.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to 24 (mise.toml, engines), so its types stay on 24 too.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
